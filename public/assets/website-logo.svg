<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Book Icon -->
  <g transform="translate(6, 6)">
    <!-- Book Spine & Pages -->
    <path d="M4 10 C14 2, 24 6, 24 18 L24 44 C24 32, 14 28, 4 36 Z" fill="url(#bookGrad)" />
    <path d="M44 10 C34 2, 24 6, 24 18 L24 44 C24 32, 34 28, 44 36 Z" fill="url(#bookGrad)" />
    <!-- Page layers -->
    <path d="M6 14 C14 8, 22 10, 23 20 L23 42 C22 32, 14 30, 6 36 Z" fill="#38bdf8" opacity="0.6"/>
    <path d="M42 14 C34 8, 26 10, 25 20 L25 42 C26 32, 34 30, 42 36 Z" fill="#38bdf8" opacity="0.6"/>
    <!-- Bookmark ribbon -->
    <path d="M22 6 L22 26 L24 23 L26 26 L26 6 Z" fill="url(#accentGrad)" />
    <!-- Glowing dot -->
    <circle cx="24" cy="5" r="3" fill="#f59e0b" />
  </g>

  <!-- Text Logo -->
  <text x="62" y="34" font-family="'Roboto', sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="1">
    BOOK<tspan fill="#0284c7">HUB</tspan>
  </text>
  <text x="63" y="48" font-family="'Roboto', sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="3.5">
    READ • LEARN • GROW
  </text>
</svg>
