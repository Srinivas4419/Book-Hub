<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g transform="translate(60, 30)">
    <!-- Empty Bookshelf -->
    <!-- Shelf Top Bar -->
    <rect x="20" y="100" width="340" height="14" rx="4" fill="#94a3b8" />
    <!-- Shelf Bottom Bar -->
    <rect x="20" y="240" width="340" height="14" rx="4" fill="#94a3b8" />
    <!-- Shelf Legs -->
    <rect x="30" y="80" width="12" height="180" rx="3" fill="#64748b" />
    <rect x="338" y="80" width="12" height="180" rx="3" fill="#64748b" />

    <!-- Spiderweb in empty corner -->
    <path d="M42 114 L75 114 M42 135 L75 114 M42 114 L42 145" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M42 125 Q55 125 60 114" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Tilted Book Stand (empty) -->
    <polygon points="120,240 135,210 145,210 130,240" fill="#cbd5e1" />

    <!-- Big Floating Magnifying Glass searching -->
    <g transform="translate(160, 80) rotate(-15)">
      <!-- Handle -->
      <rect x="80" y="150" width="22" height="75" rx="10" fill="#0284c7" transform="rotate(45 80 150)" />
      <!-- Glass Rim -->
      <circle cx="80" cy="80" r="65" fill="none" stroke="#0284c7" stroke-width="12" />
      <!-- Lens -->
      <circle cx="80" cy="80" r="59" fill="url(#lensGrad)" />
      <path d="M45 55 A45 45 0 0 1 115 55" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <!-- Question Mark inside lens -->
      <text x="80" y="98" font-family="'Roboto', sans-serif" font-size="48" font-weight="900" fill="#0284c7" text-anchor="middle">?</text>
    </g>
  </g>
</svg>
